name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy
      - name: Pytest
        run: uv run pytest -q -rs
      - name: Smoke test on CPU
        run: uv run python scripts/smoke_test.py --device cpu
      - name: Smoke test with GPUs hidden and device auto
        run: CUDA_VISIBLE_DEVICES="" uv run python scripts/smoke_test.py --device auto

  headless-render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install EGL and OSMesa
        run: sudo apt-get update && sudo apt-get install -y libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri libosmesa6
      - name: Install dependencies
        run: uv sync --locked
      - name: Render one frame with EGL and with OSMesa, no display
        run: QUANTRL_TEST_HEADLESS_RENDER=1 uv run pytest -q -rs tests/test_rendering.py
      - name: Run the cluster smoke script on a headless Linux machine without GPUs
        run: TORCH_VARIANT=cpu RUN_TESTS=0 RENDER=1 OUT_DIR=runs/cluster_smoke_ci scripts/cluster_smoke.sh
      - name: Show the cluster smoke summary
        if: always()
        run: cat runs/cluster_smoke_ci/summary.txt

  gpu-install-plans:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        variant: [cu126, cu130, rocm]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Resolve the locked ${{ matrix.variant }} environment on Linux without installing
        run: uv sync --locked --no-default-groups --group dev --group ${{ matrix.variant }} --dry-run
