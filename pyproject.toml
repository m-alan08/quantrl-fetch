[project]
name = "quantrl"
version = "0.1.0"
description = "Quantization-aware RL on a simulated Fetch robot arm: how low can a policy's precision go, and can online post-training recover it?"
readme = "README.md"
license = "MIT"
authors = [{ name = "m-alan08" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "mujoco>=3.1,<3.12",
    "gymnasium>=1.0",
    "gymnasium-robotics>=1.3",
    "imageio>=2.34",
    "imageio-ffmpeg>=0.5",
    "matplotlib>=3.8",
    "pandas>=2.2",
    "tqdm>=4.66",
    "pillow>=10.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
